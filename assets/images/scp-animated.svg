<svg width="512" height="512" viewBox="0 0 135 135"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">

  <defs>
    <style>
      .ring {
        transform-origin: 67.7px 71.5px;
        animation: spin-cw 12s linear infinite;
      }
      .arrows {
        transform-origin: 67.7px 71.5px;
        animation: spin-ccw 8s linear infinite;
      }
      @keyframes spin-cw {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        from { transform: rotate(0deg); }
        to   { transform: rotate(-360deg); }
      }
    </style>

    <path id="arrow"
          d="m64.7 30.6v24h-5.08l8.08 14 8.08-14h-5.08l-.000265-24h-5.99"
          fill="#e8e8e8"/>
  </defs>

  <!-- Inner circle — static -->
  <circle cx="67.7" cy="71.5" r="33"
          fill="none" stroke="#e8e8e8" stroke-width="6"/>

  <!-- Outer ring — clockwise -->
  <g class="ring">
    <path d="m51.9 11.9h31.7l3.07 11.4.944.391c19.4 8.03 32 26.9 32 47.9
             0 2.26-.149 4.53-.445 6.77l-.133 1.01 8.37 8.37-15.8 27.4
             -11.4-3.06-.809.623c-9.06 6.95-20.2 10.7-31.6 10.7
             -11.4 6e-5-22.5-3.77-31.6-10.7l-.81-.623-11.4 3.06
             -15.8-27.4 8.37-8.37-.133-1.01c-.296-2.25-.445-4.51-.445-6.77
             .000141-21 12.6-39.9 32-47.9l.944-.391z"
          fill="none" stroke="#e8e8e8" stroke-width="4"/>
  </g>

  <!-- Three arrows — counter-clockwise -->
  <g class="arrows">
    <use href="#arrow"/>
    <use href="#arrow" transform="rotate(120 67.7 71.5)"/>
    <use href="#arrow" transform="rotate(240 67.7 71.5)"/>
  </g>

</svg>
